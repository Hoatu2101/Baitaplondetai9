<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <title>Trang chủ</title>

    <th:block th:replace="base :: css"></th:block>
</head>

<body>

    <div th:replace="base :: header"></div>

    <section class="container mt-4">

        <!-- SEARCH -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">

                <form method="get"
                      th:action="@{/movies}">

                    <div class="row g-2">

                        <div class="col-md-3">
                            <input class="form-control"
                                   name="kw"
                                   placeholder="Tên phim">
                        </div>

                        <div class="col-md-2">

                            <select name="cateId"
                                    class="form-select">

                                <option value="">
                                    Thể loại
                                </option>

                                <option
                                    th:each="c : ${categories}"
                                    th:value="${c.id}"
                                    th:text="${c.name}">
                                </option>

                            </select>

                        </div>

                        <div class="col-md-2">
                            <input class="form-control"
                                   type="number"
                                   name="fromPrice"
                                   placeholder="Giá từ">
                        </div>

                        <div class="col-md-2">
                            <input class="form-control"
                                   type="number"
                                   name="toPrice"
                                   placeholder="Giá đến">
                        </div>

                        <div class="col-md-2">

                            <select name="sort"
                                    class="form-select">

                                <option value="">
                                    Sắp xếp
                                </option>

                                <option value="priceAsc">
                                    Giá tăng
                                </option>

                                <option value="priceDesc">
                                    Giá giảm
                                </option>

                                <option value="durationAsc">
                                    Thời lượng tăng
                                </option>

                                <option value="durationDesc">
                                    Thời lượng giảm
                                </option>

                            </select>

                        </div>

                        <div class="col-md-1">
                            <button
                                class="btn btn-primary w-100">
                                Tìm
                            </button>
                        </div>

                    </div>

                </form>

            </div>
        </div>

        <!-- TITLE -->
        <div class="d-flex justify-content-between align-items-center mb-3">

            <h3>🎬 Danh sách phim</h3>
            <div th:if="${isAdmin or isStaff}">

                <a th:href="@{/admin/movies}"
                   class="btn btn-success">
                    + Thêm phim
                </a>
            </div>
        </div>

        <!-- MOVIES TABLE -->
        <div class="card shadow-sm">

            <div class="card-body p-0">

                <table class="table table-hover table-bordered align-middle text-center m-0">

                    <thead class="table-dark">

                        <tr>
                            <th>Poster</th>
                            <th>Tên phim</th>
                            <th>Thể loại</th>
                            <th>Trạng thái</th>
                            <th>Giá vé</th>
                    <div th:if="${isAdmin or isStaff}">

                        <th width="150">Thao tác</th>
                    </div>
                    </tr>

                    </thead>

                    <tbody>

                        <tr th:each="m : ${movies}">

                            <!-- POSTER -->
                            <td width="120">

                                <img th:src="${m.poster}"
                                     class="rounded shadow-sm"
                                     style="width:100px;
                                     height:140px;
                                     object-fit:cover;"/>

                            </td>

                            <!-- MOVIE NAME -->
                            <td class="fw-bold"
                                th:text="${m.movieName}">
                            </td>

                            <!-- CATEGORY -->
                            <td th:text="${m.category != null 
                                ? m.category.name 
                                : 'Chưa phân loại'}">
                            </td>

                            <!-- STATUS -->
                            <td th:text="${m.statusMovie != null ? m.statusMovie.nameStatus : 'Đang chiếu'}"></td>

                            <!-- PRICE -->
                            <td th:text="${#numbers.formatDecimal(m.price,0,'COMMA',0,'POINT')} + ' VNĐ'">
                            </td>

                            <!-- ACTION -->
                            <td>
                                <div th:if="${isAdmin or isStaff}">

                                    <a th:href="@{'/admin/movies/' + ${m.id}}"
                                       class="btn btn-primary btn-sm">
                                        Sửa
                                    </a>

                                    <button class="btn btn-danger btn-sm"
                                            th:onclick="'deleteMovie(' + ${m.id} + ')'">
                                        Xóa
                                    </button>
                                </div>
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </section>

    <nav class="mt-4">

        <ul class="pagination">

            <li class="page-item"
                th:each="i : ${#numbers.sequence(1,10)}">

                <a class="page-link"
                   th:href="@{/movies(page=${i})}"
                   th:text="${i}">
                </a>

            </li>

        </ul>

    </nav>

    <div th:replace="base :: footer"></div>

    <script>

        function deleteMovie(id) {

            if (confirm("Bạn có chắc muốn xóa phim này?")) {

                fetch('/CenimaApp/api/movies/' + id, {
                    method: 'DELETE'
                })
                        .then(async res => {

                            const msg = await res.text();

                            if (res.ok) {

                                alert(msg);
                                location.reload();

                            } else {

                                alert(msg);
                            }
                        });
            }
        }

    </script>

</body>
</html>
