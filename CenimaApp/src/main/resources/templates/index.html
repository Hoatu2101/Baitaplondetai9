<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <title>Trang chủ</title>

    <th:block th:replace="base :: css"></th:block>
</head>

<body>

    <div th:replace="base :: header"></div>

    <section class="container mt-4">

        <!-- SEARCH -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">

                <form method="get"
                      th:action="@{/movies}">

                    <div class="row">

                        <!-- keyword -->
                        <div class="col-md-5">

                            <input type="text"
                                   name="kw"
                                   class="form-control"
                                   placeholder="Tìm phim..."
                                   th:value="${param.kw}">
                        </div>

                        <!-- category -->
                        <div class="col-md-4">

                            <select name="cateId"
                                    class="form-select">

                                <option value="">
                                    -- Tất cả thể loại --
                                </option>

                                <option th:each="c : ${categories}"
                                        th:value="${c.id}"
                                        th:text="${c.name}"
                                        th:selected="${param.cateId != null && param.cateId[0] == c.id.toString()}">
                                </option>

                            </select>
                        </div>

                        <!-- button -->
                        <div class="col-md-3">

                            <button class="btn btn-primary w-100">
                                Tìm kiếm
                            </button>

                        </div>

                    </div>

                </form>

            </div>
        </div>

        <!-- TITLE -->
        <div class="d-flex justify-content-between align-items-center mb-3">

            <h3>🎬 Danh sách phim</h3>

            <a th:href="@{/admin/movies}"
               class="btn btn-success">
                + Thêm phim
            </a>

        </div>

        <!-- MOVIES TABLE -->
        <div class="card shadow-sm">

            <div class="card-body p-0">

                <table class="table table-hover table-bordered align-middle text-center m-0">

                    <thead class="table-dark">

                        <tr>
                            <th>Poster</th>
                            <th>Tên phim</th>
                            <th>Thể loại</th>
                            <th>Trạng thái</th>
                            <th>Giá vé</th>
                            <th width="150">Thao tác</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="m : ${movies}">

                            <!-- POSTER -->
                            <td width="120">

                                <img th:src="${m.poster}"
                                     class="rounded shadow-sm"
                                     style="width:100px;
                                     height:140px;
                                     object-fit:cover;"/>

                            </td>

                            <!-- MOVIE NAME -->
                            <td class="fw-bold"
                                th:text="${m.movieName}">
                            </td>

                            <!-- CATEGORY -->
                            <td th:text="${m.category != null 
                                ? m.category.name 
                                : 'Chưa phân loại'}">
                            </td>

                            <!-- STATUS -->
                            <td th:text="${m.statusMovie != null ? m.statusMovie.nameStatus : 'Đang chiếu'}"></td>

                            <!-- PRICE -->
                            <td th:text="${#numbers.formatDecimal(m.price,0,'COMMA',0,'POINT')} + ' VNĐ'">
                            </td>

                            <!-- ACTION -->
                            <td>

                                <a th:href="@{'/admin/movies/' + ${m.id}}"
                                   class="btn btn-primary btn-sm">
                                    Sửa
                                </a>

                                <button class="btn btn-danger btn-sm"
                                        th:onclick="'deleteMovie(' + ${m.id} + ')'">
                                    Xóa
                                </button>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </section>

    <div th:replace="base :: footer"></div>

    <script>

        function deleteMovie(id) {

            if (confirm("Bạn có chắc muốn xóa phim này?")) {

                fetch('/CenimaApp/api/movies/' + id, {
                    method: 'DELETE'
                })
                        .then(async res => {

                            const msg = await res.text();

                            if (res.ok) {

                                alert(msg);
                                location.reload();

                            } else {

                                alert(msg);
                            }
                        });
            }
        }

    </script>

</body>
</html>
