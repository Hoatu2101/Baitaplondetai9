<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Danh sách phòng chiếu</title>

    <th:block th:replace="base :: css"></th:block>
</head>

<body>

<div th:replace="base :: header"></div>

<section class="container mt-4">

    <div class="d-flex justify-content-between mb-3">

        <h2>Danh sách phòng chiếu</h2>

        <a th:href="@{/admin/rooms/create}"
           class="btn btn-success">

            Thêm phòng
        </a>

    </div>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Tên phòng</th>
                <th>Sức chứa</th>
                <th>Rạp</th>
                <th>Trạng thái</th>
                <th></th>
            </tr>

        </thead>

        <tbody>

            <tr th:each="r : ${rooms}">

                <td th:text="${r.id}"></td>

                <td th:text="${r.name}"></td>

                <td th:text="${r.capacity}"></td>

                <td th:text="${r.cinemaId.name}"></td>

                <td th:text="${r.statusId.name}"></td>

                <td>

                    <a class="btn btn-warning btn-sm"
                       th:href="@{'/admin/rooms/' + ${r.id}}">
                        Sửa
                    </a>

                    <a class="btn btn-danger btn-sm"
                       th:href="@{'/admin/rooms/delete/' + ${r.id}}">
                        Xóa
                    </a>

                </td>

            </tr>

        </tbody>

    </table>

</section>

</body>
</html>
