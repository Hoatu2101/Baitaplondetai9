<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <title>Danh sách phòng chiếu</title>


    <th:block th:replace="base :: css"></th:block>
</head>

<body>

    <div th:if="${success}"
         class="alert alert-success">

        <span th:text="${success}"></span>

    </div>

    <div th:if="${error}"
         class="alert alert-danger">

        <span th:text="${error}"></span>

    </div>

    <div th:replace="base :: header"></div>

    <section class="container mt-4">

        <div class="d-flex justify-content-between mb-3">

            <h2>Danh sách phòng chiếu</h2>

            <a th:href="@{/admin/rooms/create}"
               class="btn btn-success">

                Thêm phòng
            </a>

        </div>

        <table class="table table-bordered table-hover">

            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tên phòng</th>
                    <th>Sức chứa</th>
                    <th>Rạp</th>
                    <th>Trạng thái</th>
                    <th class="text-center">Thao tác</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="r : ${rooms}">

                    <td th:text="${r.id}"></td>

                    <td th:text="${r.name}"></td>

                    <td th:text="${r.capacity}"></td>

                    <td th:text="${r.cinemaId.name}"></td>

                    <td>

                        <span th:if="${r.statusId.id == 1}"
                              class="badge bg-success">
                            Hoạt động
                        </span>

                        <span th:if="${r.statusId.id == 2}"
                              class="badge bg-warning text-dark">
                            Bảo trì
                        </span>

                        <span th:if="${r.statusId.id == 3}"
                              class="badge bg-danger">
                            Đã đóng
                        </span>

                    </td>

                    <td class="text-center">

                        <a class="btn btn-warning btn-sm"
                           th:href="@{'/admin/rooms/' + ${r.id}}">
                            Sửa
                        </a>

                        <a th:if="${r.statusId.id != 3}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Bạn có chắc muốn đóng phòng này?')"
                           th:href="@{'/admin/rooms/delete/' + ${r.id}}">
                            Đóng phòng
                        </a>

                        <a th:if="${r.statusId.id == 3}"
                           class="btn btn-success btn-sm"
                           th:href="@{'/admin/rooms/reopen/' + ${r.id}}">
                            Mở lại
                        </a>

                    </td>

                </tr>

            </tbody>
        </table>

    </section>

</body>
</html>
