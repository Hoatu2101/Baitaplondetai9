<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Movie Details</title>
    <th:block th:replace="base :: css"></th:block>
</head>

<body>

<div th:replace="base :: header"></div>

<section class="container mt-4">

    <div class="row">

        <div class="col-md-4">
            <img th:src="${movie.posterUrl}"
                 class="img-fluid"/>
        </div>

        <div class="col-md-8">

            <h1 th:text="${movie.name}"></h1>

            <p th:text="${movie.description}"></p>

            <h4>
                Giá vé:
                <span th:text="${movie.price}"></span>
            </h4>

            <a class="btn btn-danger"
               th:href="${movie.trailer}">
                Xem trailer
            </a>

        </div>

    </div>

</section>

</body>
</html>
