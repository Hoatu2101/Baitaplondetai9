<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Dashboard</title>

    <th:block th:replace="base :: css"></th:block>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div th:replace="base :: header"></div>

<section class="container mt-4">

    <h2 class="mb-4">
        Dashboard thống kê
    </h2>

    <div class="row">

        <div class="col-md-3 mb-3">

            <div class="card shadow border-0 bg-primary text-white">

                <div class="card-body">

                    <h5>Tổng phim</h5>

                    <h2 th:text="${movieCount}"></h2>

                </div>

            </div>

        </div>

        <div class="col-md-3 mb-3">

            <div class="card shadow border-0 bg-success text-white">

                <div class="card-body">

                    <h5>Tổng phòng</h5>

                    <h2 th:text="${roomCount}"></h2>

                </div>

            </div>

        </div>

        <div class="col-md-3 mb-3">

            <div class="card shadow border-0 bg-warning text-dark">

                <div class="card-body">

                    <h5>Suất chiếu</h5>

                    <h2 th:text="${showtimeCount}"></h2>

                </div>

            </div>

        </div>

        <div class="col-md-3 mb-3">

            <div class="card shadow border-0 bg-danger text-white">

                <div class="card-body">

                    <h5>Bookings</h5>

                    <h2 th:text="${bookingCount}"></h2>

                </div>

            </div>

        </div>

    </div>

    <div class="card shadow p-3 mt-4">

        <h4>
            Tổng doanh thu:
            <span class="text-danger"
                  th:text="${revenue}">
            </span>
            VNĐ
        </h4>

    </div>

    <div class="row mt-4">

        <div class="col-md-6">

            <div class="card shadow p-3">

                <h5>Doanh thu theo phim</h5>

                <canvas id="movieChart"></canvas>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card shadow p-3">

                <h5>Bookings theo ngày</h5>

                <canvas id="bookingChart"></canvas>

            </div>

        </div>

    </div>

</section>

<script th:inline="javascript">

    let movieLabels = [[${movieLabels}]];
    let movieRevenue = [[${movieRevenue}]];

    let bookingDates = [[${bookingDates}]];
    let bookingCounts = [[${bookingCounts}]];

    new Chart(document.getElementById('movieChart'), {

        type: 'bar',

        data: {
            labels: movieLabels,
            datasets: [{
                label: 'Revenue',
                data: movieRevenue
            }]
        }
    });

    new Chart(document.getElementById('bookingChart'), {

        type: 'line',

        data: {
            labels: bookingDates,
            datasets: [{
                label: 'Bookings',
                data: bookingCounts
            }]
        }
    });

</script>

</body>
</html>
