<tbody>
<tr th:each="b : ${bookings}">

    <td th:text="${b.customerName}"></td>

    <td th:text="${b.movieName}"></td>

    <td th:text="${#strings.listJoin(b.seats, ', ')}"></td>
    
    <td th:text="${b.totalPrice}"></td>

    <td th:text="${#dates.format(
            b.createdAt,
            'dd/MM/yyyy HH:mm')}">
    </td>

</tr>
</tbody>
