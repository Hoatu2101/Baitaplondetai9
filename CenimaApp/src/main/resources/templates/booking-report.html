<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Báo cáo Booking</title>

    <th:block th:replace="base :: css"></th:block>

</head>

<body>

    <div th:replace="base :: header"></div>

    <section class="container mt-4">

        <h2 class="mb-4">
            Báo cáo Booking theo ngày
        </h2>

        <!-- FORM SEARCH -->

        <div class="card shadow p-4 mb-4">

            <form method="get"
                  th:action="@{/admin/bookings}">

                <div class="row">

                    <div class="col-md-4">

                        <label class="form-label">
                            Chọn ngày
                        </label>

                        <input type="date"
                               class="form-control"
                               name="date">

                    </div>

                    <div class="col-md-2 d-flex align-items-end">

                        <button class="btn btn-primary w-100">
                            Tra cứu
                        </button>

                    </div>

                </div>

            </form>

        </div>

        <!-- KẾT QUẢ -->

        <div th:if="${bookings != null}">

            <!-- SUMMARY -->

            <div class="row mb-4">

                <div class="col-md-6">

                    <div class="card shadow border-0 bg-primary text-white">

                        <div class="card-body">

                            <h5>Tổng số Booking</h5>

                            <h2 th:text="${#lists.size(bookings)}">
                                0
                            </h2>

                        </div>

                    </div>

                </div>

                <div class="col-md-6">

                    <div class="card shadow border-0 bg-success text-white">

                        <div class="card-body">

                            <h5>Tổng doanh thu</h5>

                            <h2 th:text="${#aggregates.sum(bookings.![totalPrice])}">
                                0
                            </h2>

                        </div>

                    </div>

                </div>

            </div>

            <!-- TABLE -->

            <div class="card shadow">

                <div class="card-header bg-dark text-white">

                    Danh sách Booking

                </div>

                <div class="card-body">

                    <table class="table table-bordered table-hover">

                        <thead class="table-light">

                            <tr>

                                <th>ID</th>

                                <th>Khách hàng</th>

                                <th>Username</th>

                                <th>Suất chiếu</th>

                                <th>Ngày đặt</th>

                                <th>Tổng tiền</th>

                                <th>Chi tiết</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr th:if="${#lists.isEmpty(bookings)}">

                                <td colspan="7"
                                    class="text-center text-danger">

                                    Không có booking nào

                                </td>

                            </tr>

                            <tr th:each="b : ${bookings}">

                                <td th:text="${b.id}"></td>

                                <td th:text="${b.userId.name}"></td>

                                <td th:text="${b.userId.username}"></td>

                                <td>

                                    Showtime #
                                    <span th:text="${b.showtimeId.id}">
                                    </span>

                                </td>

                                <td th:text="${#dates.format(
                                        b.createdAt,
                                        'dd/MM/yyyy HH:mm')}">
                                </td>

                                <td>

                                    <span class="text-success fw-bold"
                                          th:text="${#numbers.formatDecimal(
                                          b.totalPrice,
                                          0,
                                          'COMMA',
                                          0,
                                          'POINT')}">
                                    </span>

                                    VNĐ

                                </td>

                                <td>

                                    <a href="#"
                                       class="btn btn-info btn-sm">

                                        Xem

                                    </a>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </section>

</body>

</html>
