<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Seat Map</title>

    <th:block th:replace="base :: css"></th:block>

    <style>

        .seat{
            width:70px;
            margin:5px;
            text-align:center;
            border-radius:8px;
            padding:10px;
            color:white;
            font-weight:bold;
        }

        .available{
            background:#198754;
        }

        .locked{
            background:#ffc107;
            color:black;
        }

        .booked{
            background:#dc3545;
        }

    </style>

</head>

<body>

<div th:replace="base :: header"></div>

<div class="container mt-4">

    <h2>Sơ đồ ghế</h2>

    <div class="row">

        <div class="col-auto"
             th:each="seat : ${seats}">

            <div class="seat"
                 th:classappend="${seat.status == 'AVAILABLE'} ?
                 ' available' :
                 (${seat.status == 'LOCKED'}
                 ? ' locked'
                 : ' booked')">

                <div th:text="${seat.seatNumber}">
                </div>

                <small th:text="${seat.status}">
                </small>

            </div>

        </div>

    </div>

</div>

</body>

</html>
