<div class="row">

    <div
        class="col-1 mb-2"
        th:each="s : ${seats}">

        <button
            class="btn w-100"

            th:classappend="
            ${s.status=='BOOKED'}
            ? 'btn-danger'
            :
            (${s.status=='LOCKED'}
            ? 'btn-warning'
            : 'btn-success')">

            [[${s.seatNumber}]]

        </button>

    </div>

</div>
