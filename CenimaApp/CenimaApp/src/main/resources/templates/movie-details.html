<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Chi tiết phim</title>

    <th:block th:replace="base :: css"></th:block>
</head>

<body>

<div th:replace="base :: header"></div>

<section class="container mt-4">

    <div class="row">

        <div class="col-md-4">

            <img th:src="${movie.poster}"
                 class="img-fluid rounded"/>

        </div>

        <div class="col-md-8">

            <h1 th:text="${movie.movieName}"></h1>

            <p th:text="${movie.description}"></p>

            <h4>
                Giá vé:
                <span th:text="${movie.price}"></span>
            </h4>

            <h5>
                Định dạng:
                <span th:text="${movie.movieFormat}"></span>
            </h5>

            <h5>
                Thời lượng:
                <span th:text="${movie.duration}"></span>
                phút
            </h5>

            <a class="btn btn-danger"
               th:href="${movie.trailer}"
               target="_blank">
                Xem trailer
            </a>

        </div>

    </div>

</section>

</body>
</html>
