
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>ADMIN- CENIMA</title>
    <th:block th:fragment="css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </th:block>
</head>
<body>
    <header th:fragment="header">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" th:href="@{/}">CinemaApp</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/}">Trang chủ</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/movies}">Phim</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/showtimes}">Suất chiếu</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/cinemas}">Rạp</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/seats}">Ghế ngồi</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/users}">Người dùng</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-warning" th:href="@{/revenue}">Doanh thu</a>
                        </li>
                    </ul>

                    <div class="navbar-nav">
                        <a class="nav-link" th:href="@{/profile}">
                            <span th:text="${session.username != null ? session.username : 'Tài khoản'}">Tài khoản</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>



    <footer th:fragment="footer">
        <div class="alert alert-info">CenimaMovie&copy; 2026</div>
    </footer>
</body>
</html>
